name: CI Verification

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Scripts, Hooks, Rules Budget & Skills
    if: "!startsWith(github.event.head_commit.message, 'chore(sync):') && !startsWith(github.event.head_commit.message, 'chore(workstation):')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install system dependencies (GNU Stow)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends stow

      - name: Install development & testing dependencies
        run: pip install -r requirements-dev.txt

      - name: Run repository verification suite
        run: ./scripts/verify-repo.sh
