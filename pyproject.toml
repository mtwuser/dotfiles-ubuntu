[project]
name = "dotfiles-ubuntu"
version = "1.8.1"
description = "Declarative Ubuntu 26.04 LTS system engine, Google Antigravity 2.0 Human-AI governance suite (AGENTS.md, hooks, skills), and zero-dependency Contextual MCP Server (N-layer surface projection, rcap1 context compaction, ephemeral forks & Docker)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []
keywords = [
    "dotfiles",
    "ubuntu",
    "gnu-stow",
    "antigravity",
    "gemini",
    "mcp",
    "model-context-protocol",
    "ai-governance",
    "pair-programming",
    "context-compaction",
    "git-subtree",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Unix Shell",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/mtwuser/dotfiles-ubuntu"
Documentation = "https://github.com/mtwuser/dotfiles-ubuntu/blob/master/docs/README.md"
Repository = "https://github.com/mtwuser/dotfiles-ubuntu.git"
Issues = "https://github.com/mtwuser/dotfiles-ubuntu/issues"
Changelog = "https://github.com/mtwuser/dotfiles-ubuntu/blob/master/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "scripts",
    "antigravity/.gemini/config/scripts",
]
addopts = "-q --tb=short -W error::DeprecationWarning"

[tool.coverage.run]
branch = true
source = [
    "scripts",
    "antigravity/.gemini/config/scripts",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "S603", "S607"]

[tool.mypy]
strict = true
mypy_path = [
    "scripts",
    "antigravity/.gemini/config/scripts",
]
